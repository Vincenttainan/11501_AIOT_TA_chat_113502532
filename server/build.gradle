plugins {
    id 'com.android.application'
}

android {
    namespace 'tw.edu.socket.server'
    compileSdk 35

    defaultConfig {
        applicationId 'tw.edu.socket.server'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
